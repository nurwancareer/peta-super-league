<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peta Klub Super League</title>
<meta name="description" content="Peta 3D 18 klub BRI Super League: lokasi stadion, nilai pasar skuad, klasemen, dan profil tiap klub.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%231F6F4A%22/%3E%3Cpath d=%22M8 3l2.4 1.8-.9 2.8H6.5l-.9-2.8z%22 fill=%22%23F4F1E8%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="gaya.css">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
</head>
<body>
<div id="panggung" class="memuat">
  <canvas id="kanvas" aria-hidden="true"></canvas>
  <div id="label" aria-hidden="true"></div>

  <header class="kartu judul">
    <span class="pill" id="pill">Super League</span>
    <h1 id="judul-utama">Peta Klub <br>Super League</h1>
    <p class="sub" id="sub">Tinggi tiap provinsi mengikuti lensa yang dipilih. Arahkan kursor ke pulau atau tiang stadion, klik untuk melihat lebih dekat.</p>
    <div class="lensa" id="lensa" role="tablist" aria-label="Tinggi provinsi"></div>
    <p class="jelas" id="jelas"></p>
    <button class="kembali" id="tbl-kembali" type="button" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Seluruh Indonesia
    </button>
    <details class="sumber-m" id="sumber-m"></details>
  </header>

  <aside class="kartu peringkat" aria-label="Peringkat">
    <div class="kepala"><h2 id="peringkat-judul">Top 5</h2><span class="kecil" id="peringkat-kolom"></span></div>
    <ol id="peringkat"></ol>
  </aside>

  <aside class="kartu detail" id="detail" aria-live="polite"></aside>

  <div class="legenda kartu" id="legenda">
    <span><i class="sw acl"></i>Peringkat 1–2</span>
    <span><i class="sw mid"></i>3–15</span>
    <span><i class="sw rel"></i>Degradasi 16–18</span>
  </div>

  <footer class="sumber" id="sumber"></footer>
  <div id="balon" class="balon" hidden></div>
  <p id="pesan" class="pesan">Memuat data…</p>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
